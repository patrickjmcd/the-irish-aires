name: build

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test-build:
    uses: patrickjmcd/workflows/.github/workflows/node-ci.yml@v1
    secrets:
      build-env: GOOGLE_SA_B64=${{ secrets.GOOGLE_SA_B64 }}

  trigger-amplify:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: trigger Amplify build
        run: |
          URL="${{secrets.AMPLIFY_BUILD_URL}}"
          curl -X POST -d {} "$URL" -H "Content-Type:application/json"
